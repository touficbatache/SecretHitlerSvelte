name: CI/CD

on:
  push:
    branches: [master]
  pull_request:

# A new push to a pull request cancels the run for the previous one. Runs on master are never
# cancelled, so a deploy is never stopped halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prettier and ESLint
        run: npm run lint

      - name: Type check
        run: npm run check

      # The PUBLIC_ settings are built into the static app. These placeholders point at the
      # emulators: nothing connects to them during the build.
      - name: Build
        run: npm run build
        env:
          PUBLIC_API_URL: http://localhost:5001/
          PUBLIC_DEBUG: "false"
          PUBLIC_USE_EMULATORS: "true"
          PUBLIC_RECAPTCHA_SITE_KEY: unused
          PUBLIC_FIREBASE_CONFIG: >-
            {"apiKey":"demo-key","authDomain":"demo-shtest.firebaseapp.com",
            "databaseURL":"https://demo-shtest-default-rtdb.firebaseio.com","projectId":"demo-shtest",
            "storageBucket":"demo-shtest.appspot.com","messagingSenderId":"1","appId":"1:1:web:1"}

      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end tests
    # Playwright 1.56 can't install Chromium on Ubuntu 26.04, which ubuntu-latest now is
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The database emulator runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Firebase CLI
        run: npm install --global firebase-tools@13.35.1

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-13.35.1

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The app runs against the auth and database emulators and a fake game API
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Every push to master that passes both jobs goes live. See "Deploy" in the README for the
  # one-time setup.
  deploy:
    name: Deploy to Firebase
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # One deploy at a time: a second merge waits for the first deploy to finish
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      # Lets the job prove to Google that it's this repo's master branch (keyless login)
      id-token: write
    env:
      FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
    steps:
      - name: Check the deploy settings
        run: |
          for name in FIREBASE_PROJECT GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT PROD_ENV_FILE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name isn't set in the repository's Actions settings. See \"Deploy\" in the README."
              exit 1
            fi
          done
          if grep -Eq '^PUBLIC_USE_EMULATORS="?true' <<< "$PROD_ENV_FILE"; then
            echo "::error::PROD_ENV_FILE sets PUBLIC_USE_EMULATORS=true: production would talk to emulators."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install the Firebase CLI
        run: npm install --global firebase-tools@15.35.0

      - run: npm ci

      # The same files and steps as a local `npm run deploy:prod`: the "prod" alias, and
      # .env.prod, which `vite build --mode prod` builds into the static app
      - name: Write the production configuration
        run: |
          printf '{ "projects": { "prod": "%s" } }\n' "$FIREBASE_PROJECT" > .firebaserc
          printf '%s\n' "$PROD_ENV_FILE" > .env.prod

      - name: Build
        run: npx vite build --mode prod

      # Static files only: no server function
      - name: Deploy
        run: firebase deploy --only hosting --project prod --non-interactive
