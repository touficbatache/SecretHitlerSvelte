name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to a pull request cancels the run for the previous one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prettier and ESLint
        run: npm run lint

      - name: Type check
        run: npm run check

      # The server validates its configuration when the build loads it. These placeholder values
      # point at the emulators: nothing connects to them during the build.
      - name: Build
        run: npm run build
        env:
          PUBLIC_API_URL: http://localhost:5001/
          PUBLIC_DEBUG: "false"
          PUBLIC_USE_EMULATORS: "true"
          PUBLIC_SECURE: "false"
          PUBLIC_RECAPTCHA_SITE_KEY: unused
          PUBLIC_FIREBASE_CONFIG: >-
            {"apiKey":"demo-key","authDomain":"demo-shtest.firebaseapp.com",
            "databaseURL":"https://demo-shtest-default-rtdb.firebaseio.com","projectId":"demo-shtest",
            "storageBucket":"demo-shtest.appspot.com","messagingSenderId":"1","appId":"1:1:web:1"}
          PRIVATE_FIREBASE_SERVER_CONFIG: >-
            {"type":"service_account","project_id":"demo-shtest","private_key_id":"ci",
            "private_key":"unused","client_email":"ci@demo-shtest.iam.gserviceaccount.com",
            "client_id":"1"}

      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The database emulator runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Firebase CLI
        run: npm install --global firebase-tools@13.35.1

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-13.35.1

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The app runs against the auth and database emulators and a fake game API
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
